<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de inicio de sesión</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header>
        <img src="imagenes-zelda/logo-pequeño.png" alt="logozelda" class="logo">
         <nav>
            <a class="boton_nav" href="index.html">Inicio</a>
            <a class="boton_nav boton_nav_activo" href="login.html">Inicio de sesión</a>
            <a class="boton_nav" href="contacto.html">Contacto</a>
        </nav>
    </header>
    <!-- Banner principal con la imagen destacada de Zelda -->
    <section>
        <div class="banner_principal">
            <img src="imagenes-zelda/imagen1-zelda.png" alt="Imagen1Zelda" class="banner_imagen">
        </div>
    </section>
    <!-- Contenido principal: video, imagen y descripción del juego -->
    <section>
        <table style="width: 80%; text-align: center; border:none;margin: 20px 150px;">
            <tr>
                <td style="width: 38%; vertical-align: top; padding: 0; border: none;">
                    <h2>Iniciar Sesión</h2>
                    <p>Ingrese sus credenciales</p>
                </td>
            </tr>
            <form action="#" method="POST">
                <tr>
                    <td colspan = "2"style="width: 80%; text-align: left; padding: 0;">
                        <label for="email" style="margin-left:350px;">Email:</label>
                        <input type="email" id="email" name="email" style="margin-left: 39px;">
                            
                        <br></br>
                        <label for="password" style="margin-left:350px;">Contraseña:</label>
                        <input type="password" id="password" name="password" style="margin-left: 5px;">
                            
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            <span class="toggle-text">Mostrar</span>
                         </button>
                
                        <br></br>
                        <input type="checkbox" id="remember" name="remember"style="margin-left:450px;">
                        <label for="remember" >
                            <strong>Recordarme</strong>
                        </label>
                    </td>
                </tr>
            </form>
            <tr>
                <td colspan = "2" style="width: 80%; text-align: center; padding: 0;">
                    <br></br>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                    <br></br>
                    <button type="submit">
                    <strong>Iniciar Sesión</strong>
                    </button>
                    <br></br>
                    <strong>O</strong>
                    <br></br>
                    <button type="button">
                        <strong>GOOGLE</strong>
                    </button>
                    <button type="button">
                        <strong>GITHUB</strong>
                    </button>
                    <br></br>
                    <strong>¿No tienes una cuenta?</strong>
                    <a href="#">Crear una cuenta</a>
                </td>
            </tr>
        </table>
    </section>
    <!-- Banner principal con la imagen destacada de Zelda -->
    <section>
        <div class="banner_principal">
            <img src="imagenes-zelda/imagen3-zelda.png" alt="Imagen3Zelda" class="banner_imagen">
        </div>
    </section>

            </div>
        </section>
