<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de inicio de sesión</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/png" href="imagenes-zelda/logo-pagina.png" sizes="32x32">
</head>

<body class="color_login">
    <section>
        <div class="banner_principal_rediseño">
            <img src="imagenes-zelda/imagen1-zelda.png" alt="Imagen1Zelda" class="banner_imagen">
        </div>
    </section>

    <header>
        <img src="imagenes-zelda/logo-pequeño.png" alt="logozelda" class="logo">
        <nav>
            <a class="boton_nav boton_nav_activo" href="index.html">Inicio</a>
            <a class="boton_nav" href="nosotros.html">Sobre nosotros</a>
            <a class="boton_nav" href="login.html">Inicio de sesión</a>
            <a class="boton_nav" href="contacto.html">Contacto</a>
        </nav>
    </header>

    <section class="login_panel">
        <div class="login_encabezado">
            <h2>Iniciar Sesión</h2>
            <p>Ingrese sus credenciales</p>
        </div>

        <form action="#" method="POST">
            <div class="login_credenciales">
                <div class="login_fila">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="login_fila">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password">
                    <button type="button" id="passwordToggle" aria-label="Toggle password visibility">
                        <span class="toggle-text">Mostrar</span>
                    </button>
                </div>

                <label class="login_recordar" for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    <strong>Recordarme</strong>
                </label>
            </div>

            <div class="login_acciones">
                <a href="#">¿Olvidaste tu contraseña?</a>
                <button type="button" class="login_boton"><strong>Iniciar Sesión</strong></button>
                <strong>O</strong>
                <div class="login_opciones_sociales">
                    <button type="button" class="login_boton"><strong>GOOGLE</strong></button>
                    <button type="button" class="login_boton"><strong>GITHUB</strong></button>
                </div>

                <div>
                    <strong>¿No tienes una cuenta?</strong>
                    <a href="#">Crear una cuenta</a>
                </div>
            </div>
        </form>
    </section>
    <!-- Banner principal con la imagen destacada de Zelda -->
    <section>
        <div class="banner_principal">
            <img src="imagenes-zelda/imagen3-zelda.png" alt="Imagen3Zelda" class="banner_imagen">
        </div>
    </section>

    <aside class="sitios_info color_info_login">
        <section class="grupo_info">
            <h3>Sitios web de compra</h3>
            <div class="lista_info">
                <a href="https://www.nintendo.com/es-cl/store/products/the-legend-of-zelda-breath-of-the-wild-switch/?srsltid=AU7gw4V14s-6I4wF00ZSldGZVlxAf1OIQEkdbyFGH-yXofG9So1y1Ynr" target="_blank" rel="noopener noreferrer">Nintendo eShop</a>
                <a href="https://www.falabella.com/falabella-cl/product/152741220/legend-of-zelda-breath-of-the-wild-n-switch-2/152741222" target="_blank" rel="noopener noreferrer">Falabella</a>
                <a href="https://www.mercadolibre.cl/the-legend-of-zelda-breath-of-the-wild-nintendo-switch-2/p/MLC49831420?matt_tool=16931662&amp;utm_source=google_shopping&amp;utm_medium=organic&amp;pdp_filters=item_id%3AMLC1624244183&amp;from=gshop">Mercado Libre</a>
            </div>
        </section>
        
        <section class="grupo_info">
            <h3>Sitios web de reseñas</h3>
            <div class="lista_info">
                <a href="https://vandal.elespanol.com/analisis/switch/the-legend-of-zelda-breath-of-the-wild/43030#p-83" target="_blank" rel="noopener noreferrer">Vandal</a>
                <a href="https://www.3djuegos.com/juegos/the-legend-of-zelda-breath-of-the-wild/analisis/es-leyenda-170302-7920" target="_blank" rel="noopener noreferrer">3D Juegos</a>
                <a href="https://www.ign.com/articles/2017/03/02/the-legend-of-zelda-breath-of-the-wild-review" target="_blank" rel="noopener noreferrer">IGN</a>
            </div>
        </section>

        <section class="grupo_info grupo_redes" aria-label="Redes sociales">
            <a href="https://www.facebook.com/LegendofZelda">
                <img src="imagenes-zelda/fb.png" alt="Facebook">
            </a>
            <a href="https://whatsapp.com/channel/0029VaTkyaQLY6d8rj26pM0A">
                <img src="imagenes-zelda/wsp.webp" alt="WhatsApp">
            </a>

                <img src="imagenes-zelda/ig.avif" alt="Instagram">
            </a>
        </section>
    </aside>

    <footer>
        <div class="pie_pagina">
            <h3>&copy; Joaquin Donoso Campusano 2026</h3>
        </div>
    </footer>
</body>
</html>
