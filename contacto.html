<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de contacto</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/png" href="imagenes-zelda/logo-pagina.png" sizes="32x32">
</head>

<body class="color_contacto">
    <section>
        <div class="banner_principal_rediseño">
            <img src="imagenes-zelda/imagen1-zelda.png" alt="Imagen1Zelda" class="banner_imagen">
        </div>
    </section>

    <header>
        <img src="imagenes-zelda/logo-pequeño.png" alt="logozelda" class="logo">
        <nav>
            <a class="boton_nav boton_nav_activo" href="index.html">Inicio</a>
            <a class="boton_nav" href="nosotros.html">Sobre nosotros</a>
            <a class="boton_nav" href="login.html">Inicio de sesión</a>
            <a class="boton_nav" href="contacto.html">Contacto</a>
        </nav>
    </header>

    <form class="form_contacto" action="#" method="POST">
        <div class="fila_form">
            <label class="etiqueta_form" for="primer_nombre">Nombres:</label>
            <div class="campos_nombres">
                <input id="primer_nombre" type="text" name="primer_nombre" placeholder="Primer Nombre">
                <input id="segundo_nombre" type="text" name="segundo_nombre" placeholder="Segundo Nombre" aria-label="Segundo nombre">
            </div>
        </div>

        <div class="fila_form">
            <label class="etiqueta_form" for="email">Email:</label>
            <input id="email" type="email" name="email" placeholder="Eje: nombre@gmail.com">
        </div>

        <div class="fila_form">
            <label class="etiqueta_form" for="telefono">Teléfono:</label>
            <div class="campos_telefono">
                <input id="prefijo" type="text" name="prefijo" value="+569" aria-label="Prefijo telefónico">
                <input id="telefono" type="tel" name="telefono" placeholder="12345678">
            </div>
        </div>

        <div class="fila_form">
            <label class="etiqueta_form" for="asunto">Asunto:</label>
            <select id="asunto" name="asunto">
                <option value="otro">Otro</option>
                <option value="soporte">Soporte</option>
                <option value="consulta">Consulta</option>
            </select>
        </div>

        <div class="fila_form">
            <label class="etiqueta_form" for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribe tu mensaje..."></textarea>
        </div>

        <div class="fila_form">
            <span class="etiqueta_form" id="etiqueta_sexo">Sexo:</span>
            <div class="opciones_form" role="group" aria-labelledby="etiqueta_sexo">
                <label><input id="masculino" type="radio" name="sexo" value="masculino">Masculino</label>
                <label><input id="femenino" type="radio" name="sexo" value="femenino">Femenino</label>
                <label><input id="otros" type="radio" name="sexo" value="otros">Otros</label>
            </div>
        </div>

        <div class="fila_form">
            <span class="etiqueta_form" id="etiqueta_intereses">Áreas de interés:</span>
            <div class="opciones_form" role="group" aria-labelledby="etiqueta_intereses">
                <label><input id="compra" type="checkbox" name="interes" value="compra">Compra</label>
                <label><input id="resena" type="checkbox" name="interes" value="reseña">Reseña</label>
                <label><input id="gameplays" type="checkbox" name="interes" value="gameplays">Gameplays</label>
                <label><input id="videos" type="checkbox" name="interes" value="videos">Videos</label>
            </div>
        </div>

        <div class="fila_form">
            <label class="etiqueta_form" for="fecha">Fecha de nacimiento:</label>
            <input id="fecha" type="date" name="fecha">
        </div>

        <div class="fila_form">
            <label class="etiqueta_form" for="color">Color:</label>
            <input id="color" type="color" name="color">
        </div>

        <div class="fila_form">
            <label class="etiqueta_form" for="file">Archivo:</label>
            <input id="file" type="file" name="file">
        </div>

        <div class="boton_form">
            <button type="submit">Enviar</button>
        </div>
    </form>

                <a href="https://www.falabella.com/falabella-cl/product/152741220/legend-of-zelda-breath-of-the-wild-n-switch-2/152741222" target="_blank" rel="noopener noreferrer">Falabella</a>

            </div>
        </section>

        <section class="grupo_info grupo_redes" aria-label="Redes sociales">
